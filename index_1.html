<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pick to Click 2026 — Tennessee Volunteers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Official University of Tennessee palette */
    --orange:#FF8200;        /* Tennessee Orange */
    --orange-600:#E36F00;    /* darker orange for hover/active */
    --orange-tint:#FFF2E4;   /* soft orange wash */
    --orange-ring:rgba(255,130,0,.28);
    --smokey:#4B4B4B;        /* Smokey Gray */
    --smokey-900:#2f2f2f;    /* deep gray for the hero */
    --white:#FFFFFF;
    --ink:#232323; --paper:#f3f4f6; --card:#ffffff;
    --line:#e7e5e4; --muted:#71717a; --bad:#c62828;
    --shadow:0 1px 2px rgba(20,20,20,.04), 0 6px 20px rgba(20,20,20,.06);
    --shadow-lg:0 10px 40px rgba(20,20,20,.10);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  /* ---------- Hero header ---------- */
  header{position:relative;background:
      radial-gradient(1200px 240px at 15% -40%, rgba(255,130,0,.22), transparent 60%),
      linear-gradient(160deg, var(--smokey) 0%, var(--smokey-900) 100%);
    color:#fff;padding:30px 20px 26px;overflow:hidden}
  .hd-inner{max-width:920px;margin:0 auto;position:relative;z-index:2}
  .hd-badge{display:inline-flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);
    color:#fff;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
    padding:5px 11px;border-radius:999px;margin-bottom:14px;backdrop-filter:blur(4px)}
  .hd-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);
    box-shadow:0 0 0 3px rgba(255,130,0,.28)}
  header h1{margin:0;font-size:34px;line-height:1.05;font-weight:900;letter-spacing:-.5px}
  header h1 .yr{color:var(--orange)}
  header .sub{opacity:.82;font-size:14px;margin-top:8px;font-weight:400;max-width:520px}
  /* iconic Tennessee checkerboard accent */
  .checker{height:12px;width:100%;
    background:repeating-conic-gradient(var(--orange) 0% 25%, #fff 0% 50%) 0 0 / 24px 24px}

  .wrap{max-width:920px;margin:0 auto;padding:22px 16px 40px}

  /* ---------- Tabs (segmented) ---------- */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 20px;
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
  .tabs button{flex:1 1 auto;border:none;background:transparent;padding:10px 14px;border-radius:10px;
    cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;
    transition:all .16s ease}
  .tabs button:hover{color:var(--ink);background:#f6f6f7}
  .tabs button.active{background:var(--orange);color:#fff;box-shadow:0 3px 10px var(--orange-ring)}

  /* ---------- Cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.3px}
  .card p.hint{color:var(--muted);font-size:13.5px;margin:2px 0 18px}

  label{display:block;font-size:12.5px;font-weight:700;margin:14px 0 6px;color:#3f3f46;
    text-transform:uppercase;letter-spacing:.3px}
  input[type=text],input[type=number],input[type=password],input[type=datetime-local],select,textarea{
    width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;
    background:#fff;color:var(--ink);font-family:inherit;transition:border-color .15s, box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-ring)}
  textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;resize:vertical}

  /* ---------- Buttons ---------- */
  .btn{background:var(--orange);color:#fff;border:none;padding:12px 18px;border-radius:11px;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
    transition:transform .12s ease, background .15s, box-shadow .15s;box-shadow:0 3px 10px var(--orange-ring)}
  .btn:hover:not(:disabled){background:var(--orange-600);transform:translateY(-1px);box-shadow:0 6px 16px var(--orange-ring)}
  .btn:active:not(:disabled){transform:translateY(0)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  .btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
  .btn.sec:hover:not(:disabled){background:#f6f6f7;border-color:#d6d3d1}
  .btn.danger{background:var(--bad);box-shadow:0 3px 10px rgba(198,40,40,.22)}
  .btn.danger:hover:not(:disabled){background:#a91f1f}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

  /* ---------- Pills / tags ---------- */
  .pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:3px 9px;
    border-radius:999px;background:#f4f4f5;color:var(--smokey);margin-left:6px;
    text-transform:uppercase;letter-spacing:.4px}
  .pill.o{background:var(--orange-tint);color:#b45309}
  .pill.d{background:#eceef2;color:#3f4756}
  .pill.fcs{background:#fef3c7;color:#92600a}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
  th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;
    background:#fafafa}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#fafafa}
  .rank{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .rankbadge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
    border-radius:8px;font-size:13px;font-weight:800;color:#fff;background:var(--smokey)}
  tr.top1 .rankbadge{background:var(--orange)}
  tr.top2 .rankbadge{background:#B4884D}
  tr.top3 .rankbadge{background:#9a9a9a}
  tr.top1 td{background:var(--orange-tint)}
  .totalcell{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:999px;background:#eee;margin-top:5px;overflow:hidden;max-width:130px}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#ffb15c);border-radius:999px}

  /* ---------- Banners ---------- */
  .banner{padding:14px 16px;border-radius:13px;font-size:14px;margin-bottom:14px;font-weight:500;
    display:flex;align-items:center;gap:6px;line-height:1.4}
  .banner.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a4a00}
  .banner.ok{background:#ecfdf3;border:1px solid #abe4c1;color:#12653a}
  .banner.err{background:#fef2f2;border:1px solid #fbcfcf;color:#9b1c1c}

  .muted{color:var(--muted)}
  .lock-state{font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.grid2{grid-template-columns:1fr}
    header h1{font-size:27px}.card{padding:18px}.tabs button{flex:1 1 40%}}
  .scorebits{font-size:12px;color:var(--muted);margin-top:2px}
  code.k{background:#f4f4f5;padding:1px 7px;border-radius:6px;font-size:13px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .foot{color:var(--muted);font-size:12.5px;text-align:center;margin:28px 0 8px;line-height:1.7}
  details.adm{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
  details.adm summary{list-style:none}
  details.adm summary::-webkit-details-marker{display:none}
  details.adm summary::before{content:"▸";color:var(--orange);margin-right:8px;font-size:12px;
    display:inline-block;transition:transform .15s}
  details.adm[open] summary::before{transform:rotate(90deg)}
  .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:620px){.statgrid{grid-template-columns:repeat(2,1fr)}}
  .freqhd{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
    color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .freqrow{margin-bottom:11px}
  .freqtop{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px;gap:8px}
  .freqtop span:first-child{font-weight:600}
</style>
</head>

const DEFENSE = POOL.filter(p => p.side === "D").sort((a,b)=>a.name.localeCompare(b.name));

const db = CONFIGURED ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

// ---- Production index (identical to the baseline formula, applied to 2026) ---
function prodIndex(pos, s){
  if(!s) return 0;
  const n = k => Number(s[k] || 0);
  const ry=n('rush_yds'), rey=n('rec_yds'), rtd=n('rush_td'), retd=n('rec_td'), rec=n('rec'),
        py=n('pass_yds'), ptd=n('pass_td'), pint=n('pass_int'),
        tk=n('tackles'), tfl=n('tfl'), sk=n('sacks'), it=n('int'), pbu=n('pbu');
  switch(pos){
    case 'RB': return ry + rey + 10*(rtd+retd);
    case 'WR': case 'TE': return rey + 5*rec + 10*retd;
    case 'QB': return 0.25*py + 20*ptd - 15*pint + ry;
    case 'DB': return 2*tk + 25*it + 6*pbu;
    case 'DL': case 'LB': return 2*tk + 4*tfl + 10*sk;
    default: return 0;
  }
}
function minmax(v, arr){
  const mn=Math.min(...arr), mx=Math.max(...arr);
  if(mx===mn) return 50;
  return 100*(v-mn)/(mx-mn);
}
// Improvement is graded on its OWN MERIT (absolute), not on a curve against the
// other entrants: a great season scores high regardless of what anyone else did.
// impScore = 100 * r / (r + IMP_C), where r = max(0, (P1-P0)/(P0+k)).
//   r <= 0 (no improvement / regression) -> 0
//   r == IMP_C                            -> 50
//   huge breakout                         -> approaches 100
// IMP_C is the "half-credit" improvement ratio; lower = more generous.
const IMP_C = 2;
function improvementScore(r){
  const x = Math.max(0, r);
  return 100 * x / (x + IMP_C);
}

// ---- Scoring engine ----------------------------------------------------------
// Score = 0.5*Improvement + 0.2*LowBaseline + 0.3*Rarity, each 0-100.
// Improvement is absolute (own merit). LowBaseline & Rarity are still relative
// to the field, normalized within position group when 2+ picked players share a
// position, else within side. Total = offense pick score + defense pick score.
function scoreSide(entries, pickKey, liveById, k){
  const N = entries.length;
  const picks = entries.map(e => e[pickKey]).filter(Boolean);
  const distinct = [...new Set(picks)];
  const counts = {}; picks.forEach(p => counts[p] = (counts[p]||0)+1);
  const m = {};
  distinct.forEach(id => {
    const pl = BY_ID[id]; if(!pl) return;
    const p0 = pl.p0;
    const p1 = prodIndex(pl.pos, liveById[id]);
    m[id] = { pos: pl.pos, p0, p1, imp: (p1 - p0)/(p0 + k), rarityRaw: -Math.log(counts[id]/N) };
  });
  const out = {};
  distinct.forEach(id => {
    if(!m[id]) return;
    const pos = m[id].pos;
    const samePos = distinct.filter(d => m[d] && m[d].pos === pos);
    const group = samePos.length >= 2 ? samePos : distinct.filter(d=>m[d]);
    const impN = improvementScore(m[id].imp);   // absolute — own merit, ignores the group
    const rarN = minmax(m[id].rarityRaw, group.map(d => m[d].rarityRaw));
    const strictlyLess = group.filter(d => m[d].p0 < m[id].p0).length;
    const lowN = 100 * (1 - strictlyLess/group.length);
    out[id] = { ...m[id], impN, lowN, rarN, score: 0.5*impN + 0.2*lowN + 0.3*rarN,
                pickCount: counts[id], N };
  });
  return out;
}
function buildLeaderboard(entries, liveById, k){
  const revealed = entries.filter(e => e.offense_player_id && e.defense_player_id);
  if(!revealed.length) return [];
  const offN = scoreSide(revealed, 'offense_player_id', liveById, k);
  const defN = scoreSide(revealed, 'defense_player_id', liveById, k);
  const board = revealed.map(e => {
    const o = offN[e.offense_player_id], d = defN[e.defense_player_id];
    return { name: e.entrant_name, o, d,
             oScore: o ? o.score : 0, dScore: d ? d.score : 0,
             total: (o?o.score:0) + (d?d.score:0),
             oName: e.offense_player_name, dName: e.defense_player_name };
  });
  board.sort((a,b) => b.total - a.total);
  return board;
}

function PlayerOption(p){

// ---- App ---------------------------------------------------------------------
function App(){
  const [tab, setTab] = useState("pick");
  const [settings, setSettings] = useState(null);
  const [entrants, setEntrants] = useState([]);
  const [live, setLive] = useState({});
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");

  async function refresh(){
    if(!db) { setLoading(false); return; }
    setErr("");
    try{
      const [s, e, l] = await Promise.all([
        db.from('settings').select('*').eq('id',1).single(),
        db.from('entrants_public').select('*').order('created_at',{ascending:true}),
        db.from('live_stats').select('*'),
      ]);
      if(s.error) throw s.error;
      setSettings(s.data);
      setEntrants(e.data || []);
      const map = {}; (l.data||[]).forEach(r => map[r.player_id] = r); setLive(map);
    }catch(ex){ setErr(ex.message || String(ex)); }
    setLoading(false);
  }
  useEffect(()=>{ refresh(); }, []);

  const locked = settings ? settings.submissions_locked : false;
  const k = settings ? Number(settings.k) : 150;
  const board = useMemo(()=> buildLeaderboard(entrants, live, k), [entrants, live, k]);

  if(!CONFIGURED){
    return <div className="wrap"><div className="banner warn">
      <b>Not configured yet.</b> This is the built app running before deploy. Once we paste your
      Supabase URL and anon key into the CONFIG block up top, it goes live. Everything else is ready.
    </div>
    <div className="card"><h2>What's here</h2>
      <p className="hint">89 players embedded, scoring engine built, admin wired. Pick / Entrants /
      Leaderboard / Admin tabs are all present — they just need the database connected.</p></div>
    </div>;
  }

  return (
    <div className="wrap">
      {err && <div className="banner err">Error: {err}</div>}
      <div className="lock-state">
        {locked
          ? <div className="banner ok">🔒 Submissions are <b>locked</b> — picks are revealed and the leaderboard is live.</div>
          : <div className="banner warn">🟢 Submissions are <b>open</b>. Picks stay hidden until the deadline{settings && settings.lock_at ? " (" + new Date(settings.lock_at).toLocaleString() + ")" : ""}.</div>}
      </div>

      <div className="tabs">
        <button className={tab==="pick"?"active":""} onClick={()=>setTab("pick")}>Make a Pick</button>
        <button className={tab==="who"?"active":""} onClick={()=>setTab("who")}>Who's In ({entrants.length})</button>
        <button className={tab==="board"?"active":""} onClick={()=>setTab("board")}>Leaderboard</button>
        <button className={tab==="rules"?"active":""} onClick={()=>setTab("rules")}>How Scoring Works</button>
        <button className={tab==="admin"?"active":""} onClick={()=>setTab("admin")}>Admin</button>
      </div>

      {loading && <p className="muted">Loading…</p>}
      {!loading && tab==="pick"   && <PickForm locked={locked} onDone={refresh} />}
      {!loading && tab==="who"    && <WhosIn entrants={entrants} locked={locked} />}
      {!loading && tab==="board"  && <Board board={board} locked={locked} live={live} entrants={entrants} />}
      {!loading && tab==="rules"  && <Rules k={k} />}
      {!loading && tab==="admin"  && <Admin settings={settings} entrants={entrants} live={live} onDone={refresh} />}

      <div className="foot">Pick to Click 2026 · scoring: 50% improvement / 20% low baseline / 30% rarity · k = {k}</div>
    </div>
  );
}

function PickForm({locked, onDone}){
  const [name, setName] = useState("");
  const [off, setOff] = useState("");
  const [def, setDef] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  if(locked) return <div className="card"><h2>Picks are closed</h2>
    <p className="hint">The submission window is locked. Head to the Leaderboard to see how everyone's doing.</p></div>;

  async function submit(){
    setMsg(null);
    if(!name.trim()) return setMsg({t:"err",m:"Enter your name."});
    if(!off || !def) return setMsg({t:"err",m:"Pick one offensive and one defensive player."});
    setBusy(true);
    const o = BY_ID[off], d = BY_ID[def];
    const { error } = await db.from('entries').insert({
      entrant_name: name.trim(),
      offense_player_id: o.id, offense_player_name: o.name,
      defense_player_id: d.id, defense_player_name: d.name,
    });
    setBusy(false);
    if(error){
      if((error.message||"").toLowerCase().includes("duplicate"))
        setMsg({t:"err",m:"That name already has an entry. Ask the admin to remove it if you need to re-pick."});
      else setMsg({t:"err",m:error.message});
      return;
    }
    setMsg({t:"ok",m:"You're in! Your pick stays hidden until the deadline."});
    setName(""); setOff(""); setDef("");
    onDone();
  }

  return <div className="card">
    <h2>Make your pick</h2>
    <p className="hint">One offensive player + one defensive player you think will break out this season.
    Lower prior production and fewer people on your pick = more upside.</p>
    {msg && <div className={"banner "+(msg.t==="ok"?"ok":"err")}>{msg.m}</div>}
    <label>Your name</label>
    <input type="text" value={name} maxLength={40} onChange={e=>setName(e.target.value)} placeholder="e.g. Alex" />
    <div className="grid2">
      <div>
        <label>Offensive pick <span className="pill o">O</span></label>
        <select value={off} onChange={e=>setOff(e.target.value)}>
          <option value="">— choose —</option>
          {["QB","RB","WR","TE"].map(pos=>{
            const grp = OFFENSE.filter(p=>p.pos===pos);
            return <optgroup key={pos} label={pos}>
              {grp.map(p=><option key={p.id} value={p.id}>{PlayerOption(p)}</option>)}
            </optgroup>;
          })}
        </select>
      </div>
      <div>
        <label>Defensive pick <span className="pill d">D</span></label>
        <select value={def} onChange={e=>setDef(e.target.value)}>
          <option value="">— choose —</option>
          {["DL","LB","DB"].map(pos=>{
            const grp = DEFENSE.filter(p=>p.pos===pos);
            return <optgroup key={pos} label={pos}>
              {grp.map(p=><option key={p.id} value={p.id}>{PlayerOption(p)}</option>)}
            </optgroup>;
          })}
        </select>
      </div>
    </div>
    <div style={{marginTop:16}}>
      <button className="btn" disabled={busy} onClick={submit}>{busy?"Submitting…":"Submit my picks"}</button>
    </div>
  </div>;
}

function WhosIn({entrants, locked}){
  return <div className="card">
    <h2>Who's in {locked ? "— picks revealed" : "— picks hidden"}</h2>
    <p className="hint">{locked
      ? "Submissions are locked, so everyone's picks are shown."
      : "The roster of entrants is public during the open window, but nobody's actual picks are visible yet."}</p>
    {!entrants.length && <p className="muted">No entries yet — be the first.</p>}
    {!!entrants.length && <table>
      <thead><tr><th>Entrant</th>{locked && <th>Offense</th>}{locked && <th>Defense</th>}</tr></thead>

function FreqList({title, rows, total, maxCount}){

function Board({board, locked, live, entrants}){
  const hasStats = Object.keys(live).length > 0;
  if(!locked) return <div className="card"><h2>Leaderboard</h2>
    <p className="hint">The leaderboard turns on once the admin locks submissions and the first 2026
    stats are in. Until then, picks stay hidden.</p></div>;
  if(!board.length) return <div className="card"><h2>Leaderboard</h2>
    <p className="hint">Locked, but no scored entries yet.</p></div>;

  // "Who got picked" — pick frequency from the revealed entries
  const revealed = (entrants || []).filter(e => e.offense_player_name && e.defense_player_name);
  const total = revealed.length;
  function freq(key){
    const c = {};
    revealed.forEach(e => { const nm = e[key]; if(nm) c[nm] = (c[nm]||0)+1; });
    return Object.entries(c).map(([name,count]) => ({name,count}))
      .sort((a,b) => b.count-a.count || a.name.localeCompare(b.name));
  }
  const oFreq = freq('offense_player_name'), dFreq = freq('defense_player_name');
  const maxCount = Math.max(1, ...oFreq.map(x=>x.count), ...dFreq.map(x=>x.count));

  return <React.Fragment>
    <div className="card">
      <h2>Leaderboard</h2>
      <p className="hint">{hasStats ? "Live through the season as stats come in." :
        "Locked — showing 0s until the first 2026 stats are entered."} Total = offense score + defense score (each 0–100).</p>
      <table>
        <thead><tr><th>#</th><th>Entrant</th><th>Offense</th><th>Defense</th><th>Total</th></tr></thead>
        <tbody>
          {board.map((r,i)=><tr key={r.name} className={i<3?"top"+(i+1):""}>
            <td><span className="rankbadge">{i+1}</span></td>
            <td style={{fontWeight:600}}>{r.name}</td>
            <td>{r.oName}<div className="scorebits">{r.o?r.o.score.toFixed(1):"0"} pts</div></td>
            <td>{r.dName}<div className="scorebits">{r.d?r.d.score.toFixed(1):"0"} pts</div></td>
            <td>
              <div className="totalcell">{r.total.toFixed(1)}</div>
              <div className="bar"><span style={{width:Math.max(4,(r.total/((board[0]&&board[0].total)||1))*100)+"%"}}></span></div>
            </td>
          </tr>)}
        </tbody>
      </table>
    </div>
    <div className="card">
      <h2>Who got picked</h2>
      <p className="hint">How many of the {total} entrant{total===1?"":"s"} took each player. Fewer takers earn more rarity points.</p>
      <div className="grid2">
        <FreqList title="Offense" rows={oFreq} total={total} maxCount={maxCount} />
        <FreqList title="Defense" rows={dFreq} total={total} maxCount={maxCount} />
      </div>
    </div>
  </React.Fragment>;
}

function Rules(){
  const parts = [
    { w: "50%", n: "Improvement", d: "how much your player outproduces their 2025 season" },
    { w: "30%", n: "Rarity",      d: "bonus for a pick few other people made" },
    { w: "20%", n: "Low baseline",d: "bonus for a player who did little last year" },
  ];
  return <div className="card">
    <h2>How scoring works</h2>
    <p className="hint">Each pick's score comes from three things. Your total is your offense pick plus your defense pick.</p>
    {parts.map(p => (
      <div key={p.n} style={{display:"flex",alignItems:"baseline",gap:"14px",padding:"14px 0",borderTop:"1px solid var(--line)"}}>
        <span style={{color:"var(--orange)",fontWeight:800,fontSize:"20px",minWidth:"56px",fontVariantNumeric:"tabular-nums"}}>{p.w}</span>
        <span style={{fontSize:"15px"}}><b>{p.n}</b> <span className="muted">— {p.d}</span></span>
      </div>
    ))}
  </div>;
}

// ---- Admin -------------------------------------------------------------------
async function callAdmin(adminKey, action, extra){
  const res = await fetch('/api/admin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ adminKey, action, ...(extra||{}) })
  });
  let data = {}; try{ data = await res.json(); }catch{}
  if(!res.ok) throw new Error(data.error || ('HTTP '+res.status));
  return data;
}
const STAT_FIELDS = {
  RB:['rush_att','rush_yds','rush_td','rec','rec_yds','rec_td'],
  WR:['rec','rec_yds','rec_td'], TE:['rec','rec_yds','rec_td'],
  QB:['pass_yds','pass_td','pass_int','rush_yds','rush_td'],
  DB:['tackles','int','pbu'], LB:['tackles','tfl','sacks'], DL:['tackles','tfl','sacks'],
};

// ---- Bulk stats paste (CSV/TSV) ---------------------------------------------
const ALLOWED_STATS = ['rush_att','rush_yds','rush_td','pass_att','pass_yds','pass_td',
  'pass_int','rec','rec_yds','rec_td','tackles','tfl','sacks','int','pbu'];
const NORM = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const POOL_BY_NORM = {}; POOL.forEach(p => { POOL_BY_NORM[NORM(p.name)] = p; });

// Accepts a header row with a "player" (name or id) column plus any stat columns.
// Matches names to the roster; returns matched rows + a list of unmatched names.
function parseBulkStats(text){
  const lines = String(text).split(/\r?\n/).map(l => l.replace(/\s+$/,'')).filter(l => l.trim());
  if(lines.length < 2) return { error: 'Paste a header row plus at least one data row.' };
  const delim = lines[0].indexOf('\t') >= 0 ? '\t' : ',';
  const header = lines[0].split(delim).map(h => h.trim().toLowerCase());
  const nameIdx = header.findIndex(h => h === 'player' || h === 'name' || h === 'player_id');
  if(nameIdx < 0) return { error: 'Header must include a "player" column.' };
  const statCols = header.map((h,i) => ({h,i})).filter(x => ALLOWED_STATS.includes(x.h));
  if(!statCols.length) return { error: 'No known stat columns found. Allowed: ' + ALLOWED_STATS.join(', ') };
  const rows = [], unmatched = [];
  for(let li = 1; li < lines.length; li++){
    const cells = lines[li].split(delim);
    const nameCell = (cells[nameIdx] || '').trim();
    if(!nameCell) continue;
    const pl = BY_ID[nameCell] || POOL_BY_NORM[NORM(nameCell)];
    if(!pl){ unmatched.push(nameCell); continue; }
    const row = { player_id: pl.id, _name: pl.name, _pos: pl.pos };
    let any = false;
    statCols.forEach(({h,i}) => { const v = (cells[i] || '').trim();
      if(v !== '' && !isNaN(Number(v))){ row[h] = Number(v); any = true; } });
    if(any) rows.push(row);
  }
  return { rows, unmatched, statCols: statCols.map(c => c.h) };
}

function Admin({settings, entrants, live, onDone}){
  const [key, setKey] = useState("");
  const [msg, setMsg] = useState(null);
  const [kval, setKval] = useState(settings ? settings.k : 150);
  const [statPlayer, setStatPlayer] = useState("");
  const [statVals, setStatVals] = useState({});
  const [busy, setBusy] = useState(false);
  const [bulkText, setBulkText] = useState("");
  const [bulkPreview, setBulkPreview] = useState(null);

  function flash(t,m){ setMsg({t,m}); }
  async function run(action, extra){
    if(!key) return flash("err","Enter your admin key first.");
    setBusy(true);
    try{ const r = await callAdmin(key, action, extra); flash("ok", r.message || "Done."); onDone(); }
    catch(ex){ flash("err", ex.message); }
    setBusy(false);
  }

  const chosen = statPlayer ? BY_ID[statPlayer] : null;
  const fields = chosen ? STAT_FIELDS[chosen.pos] : [];

  function loadCurrent(id){
    setStatPlayer(id);
    const cur = live[id] || {};
    const v = {}; (STAT_FIELDS[(BY_ID[id]||{}).pos]||[]).forEach(f=> v[f] = cur[f] ?? "");
    setStatVals(v);
  }
  async function saveStats(){
    if(!chosen) return flash("err","Pick a player.");
    const row = { player_id: chosen.id };
    fields.forEach(f => { if(statVals[f] !== "" && statVals[f] !== undefined) row[f] = statVals[f]; });
    await run('update_stats', { stats:[row] });
  }

  return <div className="card">
    <h2>Admin</h2>
    <p className="hint">Enter your ADMIN_KEY to unlock actions. It's checked server-side and never stored.</p>
    {msg && <div className={"banner "+(msg.t==="ok"?"ok":"err")}>{msg.m}</div>}
    <label>Admin key</label>
    <input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="your secret admin key" />

    <details className="adm" open>
      <summary style={{cursor:"pointer",margin:"14px 0 6px",fontWeight:600}}>Submissions</summary>
      <p className="lock-state muted">Currently: <b>{settings && settings.submissions_locked ? "LOCKED" : "OPEN"}</b> · {entrants.length} entries</p>
      <div className="row">
        <button className="btn" disabled={busy} onClick={()=>{ if(confirm("Lock submissions and REVEAL all picks? Entrants can no longer submit.")) run('lock'); }}>Lock &amp; reveal picks</button>
        <button className="btn sec" disabled={busy} onClick={()=>run('unlock')}>Re-open (hide again)</button>
      </div>
    </details>

    <details className="adm">
      <summary style={{cursor:"pointer",margin:"14px 0 6px",fontWeight:600}}>Smoothing constant k</summary>
      <div className="row">
        <div style={{flex:"1 1 120px"}}>
          <input type="number" value={kval} onChange={e=>setKval(e.target.value)} />
        </div>
        <button className="btn" disabled={busy} onClick={()=>run('set_k',{k:Number(kval)})}>Set k</button>
      </div>
    </details>

    <details className="adm">
      <summary style={{cursor:"pointer",margin:"14px 0 6px",fontWeight:600}}>Enter / update 2026 stats</summary>
      <label>Player</label>
      <select value={statPlayer} onChange={e=>loadCurrent(e.target.value)}>
        <option value="">— choose player —</option>
        <optgroup label="Offense">{OFFENSE.map(p=><option key={p.id} value={p.id}>{p.name} ({p.pos})</option>)}</optgroup>
        <optgroup label="Defense">{DEFENSE.map(p=><option key={p.id} value={p.id}>{p.name} ({p.pos})</option>)}</optgroup>
      </select>
      {chosen && <div style={{marginTop:12}}>
        <p className="hint">Cumulative season totals for {chosen.name}. Leave a field blank to keep it at 0.</p>
        <div className="statgrid">
          {fields.map(f=><div key={f}>
            <label style={{margin:"0 0 4px"}}>{f}</label>
            <input type="number" value={statVals[f] ?? ""} onChange={e=>setStatVals({...statVals,[f]:e.target.value})} />
          </div>)}
        </div>
        <div style={{marginTop:12}}><button className="btn" disabled={busy} onClick={saveStats}>Save {chosen.name}'s stats</button></div>
      </div>}
    </details>

    <details className="adm">
      <summary style={{cursor:"pointer",margin:"14px 0 6px",fontWeight:600}}>Bulk upload stats (paste CSV)</summary>
      <p className="hint">Paste a CSV or TSV with a <b>player</b> column (name or #) plus stat columns —
        any of: {ALLOWED_STATS.join(", ")}. Use <b>cumulative season totals</b>. One row per player; unlisted stats stay 0.</p>
      <textarea className="mono" rows={7} value={bulkText}
        placeholder={"player,rush_yds,rush_td,rec,rec_yds,rec_td\nDeSean Bishop,1180,17,12,160,1\nJustin Baker,640,6,4,55,0"}
        onChange={e=>{ setBulkText(e.target.value); setBulkPreview(null); }} />
      <div className="row" style={{marginTop:10}}>
        <button className="btn sec" disabled={!bulkText.trim()} onClick={()=>setBulkPreview(parseBulkStats(bulkText))}>Preview</button>
        {bulkPreview && !bulkPreview.error &&
          <button className="btn" disabled={busy || !bulkPreview.rows.length}
            onClick={()=>{ run('update_stats', { stats: bulkPreview.rows.map(({_name,_pos,...r})=>r) });
                           setBulkText(""); setBulkPreview(null); }}>
            Upload {bulkPreview.rows.length} player{bulkPreview.rows.length===1?"":"s"}
          </button>}
      </div>
      {bulkPreview && bulkPreview.error && <div className="banner err" style={{marginTop:10}}>{bulkPreview.error}</div>}
      {bulkPreview && !bulkPreview.error && <div style={{marginTop:12}}>
        <p className="hint">Matched <b>{bulkPreview.rows.length}</b> · columns: {bulkPreview.statCols.join(", ")}
          {bulkPreview.unmatched.length ? <span style={{color:"var(--bad)"}}> · unmatched (skipped): {bulkPreview.unmatched.join(", ")}</span> : ""}</p>
        {!!bulkPreview.rows.length && <table>
          <thead><tr><th>Player</th>{bulkPreview.statCols.map(c=><th key={c}>{c}</th>)}</tr></thead>
          <tbody>{bulkPreview.rows.slice(0,60).map((r,i)=><tr key={i}>
            <td>{r._name} <span className="muted">({r._pos})</span></td>
            {bulkPreview.statCols.map(c=><td key={c}>{r[c]!==undefined?r[c]:"—"}</td>)}
          </tr>)}</tbody>
        </table>}
      </div>}
    </details>

    <details className="adm">
      <summary style={{cursor:"pointer",margin:"14px 0 6px",fontWeight:600}}>Manage entries</summary>
      {!entrants.length && <p className="muted">No entries yet.</p>}
      {!!entrants.length && <table><thead><tr><th>Entrant</th><th></th></tr></thead><tbody>
        {entrants.map(e=><tr key={e.id}>
          <td>{e.entrant_name}</td>
          <td style={{textAlign:"right"}}>
            <button className="btn danger" style={{padding:"6px 10px",fontSize:13}} disabled={busy}
              onClick={()=>{ if(confirm("Delete "+e.entrant_name+"'s entry?")) run('delete_entry',{entry_id:e.id}); }}>Delete</button>
          </td>
        </tr>)}
      </tbody></table>}
    </details>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  // Transform the JSX above with the CLASSIC runtime (uses React.createElement,
  // so no ES-module import is injected) and run it. If a CDN library failed to
  // load, show a clear message instead of a blank page.
  (function(){
    try{
      if(typeof Babel === "undefined") throw new Error("Babel failed to load (check your internet / CDN access).");
      if(typeof React === "undefined" || typeof ReactDOM === "undefined") throw new Error("React failed to load from CDN.");
      var src = document.getElementById("ptc-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(out);
    }catch(e){
      document.getElementById("root").innerHTML =
        '<div class="wrap"><div class="banner err"><b>App failed to start.</b> ' +
        (e && e.message ? e.message : e) + '</div></div>';
      console.error(e);
    }
  })();
</script>
